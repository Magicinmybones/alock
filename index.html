/* =====================================================================
   MOTION — opening sequence + continuous signal pulses
   Timings sampled from the reference recording (30 fps); t = 0 is the
   first typed character. All values live here for easy tuning.
   ===================================================================== */
:root{
  --blink:.54s;                       /* cursor: ~8 frames on / 8 off           */
  --t-nav:.27s; --t-logo:.33s; --t-btn:.47s;     /* header rises in           */
  --t-sub:.30s; --d-sub:.55s;         /* subtitle left→right wipe              */
  --t-card:.36s; --d-card:.62s;       /* card de-blurs in                      */
  --t-port:.57s;                      /* hex + bottom port nodes appear        */
  --t-trust:.82s;                     /* "Trusted by" rises                    */
  --t-hex:1.13s;                      /* chevrons draw: rail → bend → tip → card */
  --t-bot:1.45s;                      /* bottom port: node → card / columns    */
  --t-logos:1.35s; --stag-logo:.20s;  /* partner logos, left → right           */
  --ease-out:cubic-bezier(.22,.8,.26,1);
  --ease-io:cubic-bezier(.55,.1,.35,1);
}
/* pre-play: only the animated pieces are hidden, and only while the intro is armed */
html.intro:not(.play) :is(.h1,.brand,.nav,.btn-ghost,.sub,.shell,.panel,.trusted,.logo,.conn,.menu-btn){opacity:0}

@media (prefers-reduced-motion:no-preference){
  html.play:not(.settled) .nav{animation:hdrIn .6s var(--ease-out) var(--t-nav) both}
  html.play.flow:not(.settled) .nav{animation:none}
  html.play:not(.settled) .brand{animation:hdrIn .6s var(--ease-out) var(--t-logo) both}
  html.play:not(.settled) :is(.btn-ghost,.menu-btn){animation:hdrIn .6s var(--ease-out) var(--t-btn) both}
  html.play:not(.settled) .sub{-webkit-mask-image:linear-gradient(90deg,#000 40%,transparent 60%);mask-image:linear-gradient(90deg,#000 40%,transparent 60%);
    -webkit-mask-size:250% 100%;mask-size:250% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    animation:wipe var(--d-sub) linear var(--t-sub) both}
  html.play:not(.settled) :is(.shell,.panel){animation:deblur var(--d-card) var(--ease-out) var(--t-card) both}
  html.play:not(.settled) .trusted{animation:riseClip .32s var(--ease-out) var(--t-trust) both}
  html.play:not(.settled) .logo{animation:logoIn .6s var(--ease-out) calc(var(--t-logos) + var(--i,0) * var(--stag-logo)) both}
  html.play:not(.settled) .conn{animation:fade .4s ease-out var(--t-bot) both}

  /* SVG circuitry. --el = seconds since play began, so a frame redraw (resize)
     mid-sequence resumes at the right moment instead of restarting. */
  html.play #frame .dr{stroke-dasharray:1;animation:draw var(--dd) var(--ease-io) calc(var(--dl) - var(--el,0s)) both}
  #frame .d1{--dl:var(--t-hex);--dd:.17s}
  #frame .d2{--dl:calc(var(--t-hex) + .17s);--dd:.16s}
  #frame .d3{--dl:calc(var(--t-hex) + .33s);--dd:.2s}
  #frame .b1{--dl:var(--t-bot);--dd:.2s}
  #frame .b2{--dl:calc(var(--t-bot) + .18s);--dd:.22s}
  html.play #frame .port{animation:fade .35s ease-out calc(var(--t-port) - var(--el,0s)) both}
  html.play #frame .flares{display:none}
  html.play #frame .pulses{display:inline;animation:fade .25s linear calc(var(--pv) - var(--el,0s)) both}
}
#frame .pulses{display:none}
#frame .ph{--pv:calc(var(--t-hex) + .2s)}
#frame .pb{--pv:calc(var(--t-bot) + .25s)}
/* a white data packet travelling along the pink trace toward the card */
#frame .pulse{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:var(--dash) 200;
  animation:packet var(--dur) linear calc(var(--pd) - var(--el,0s)) infinite}
@keyframes packet{0%{stroke-dashoffset:0;opacity:0}5%{opacity:1}92%{opacity:1}100%{stroke-dashoffset:-100;opacity:0}}

<script>
(function(){
  "use strict";
  var BW=1449, BH=1086;                 // reference artboard
  var root=document.documentElement, stage=document.getElementById('stage'), svg=document.getElementById('frame');
  var NS='http://www.w3.org/2000/svg', playStart=null;
  var COLS=[235.5,357.5,480,602,724,846,968.5,1090.5,1213];   // measured grid columns
  var STEP_X=122.25, STEP_Y=116.8;

  /* ---------- layout engine ----------
     The reference is a 1449×1086 artboard. Everything is solved in design units
     and the whole stage is then scaled by s.
       • 4:3 viewport  → exact reference (c = 1, no stretch).
       • wider (16:9+) → vertical gaps tighten, the hero block grows by c (up to 1.3×),
                         the side rails move outward (p) so the hex ports clear the
                         bigger card, and the grid columns between them stretch by fx.
       • taller        → extra height goes into the gaps above/below the hero.
  ----------------------------------------------------------------------------------- */
  var HERO_TOP=206, HERO_H=487, FOOT_H=250.5, HEAD_H=134.5;
  var lerp=function(a,b,t){return a+(b-a)*t}, clamp=function(v,a,b){return Math.max(a,Math.min(b,v))};
  var logos=[].slice.call(document.querySelectorAll('.logo'));
  function solve(vw,vh){
    var s,W,H;
    if(vw/vh >= BW/BH){ s=vh/BH; H=BH; W=vw/s; } else { s=vw/BW; W=BW; H=vh/s; }
    var dx=(W-BW)/2;
    var t=clamp((vw/vh-BW/BH)/(16/9-BW/BH),0,1);           // 0 at 4:3 → 1 at 16:9
    var fF=lerp(1,.9,t);                                   // footer band tightening
    var G1min=lerp(71.5,40,t), G2min=lerp(142,92,t);
    var avail=H-HEAD_H-FOOT_H*fF;
    var cMax=Math.max(lerp(1,1.3,t),1+Math.min(.12,(H-BH)/BH*.6));   // also grow a little on taller-than-4:3 screens
    var pMax=Math.max(0,dx+113-64);                        // rails stay ≥64u from the edge
    var cW=(pMax+541.5)/524;                               // hex/card clearance limit
    var c=Math.max(1,Math.min(cMax,(avail-G1min-G2min)/HERO_H,cW));
    var spare=Math.max(0,avail-HERO_H*c-G1min-G2min);
    var G1=G1min+spare*.5;
    var p=clamp(Math.max(524*c-541.5,dx*.35*t),0,pMax);
    return {s:s,W:W,H:H,dx:dx,t:t,c:c,fF:fF,G1:G1,p:p,fx:(1223+2*p)/1223};
  }
  function layout(){
    var vw=window.innerWidth, vh=window.innerHeight, L=solve(vw,vh);
    var flow = vw<900 || L.s<0.56 || L.H/BH>1.42;
    root.classList.toggle('flow',flow);
    if(flow){ ['--p','--lx'].forEach(function(k){root.style.setProperty(k,'0px')}); return; }
    root.classList.remove('menu-open');
    var heroTop=HEAD_H+L.G1, heroBot=heroTop+HERO_H*L.c, yB=L.H-FOOT_H*L.fF;
    var R=root.style;
    R.setProperty('--s',L.s); R.setProperty('--W',L.W); R.setProperty('--H',L.H);
    R.setProperty('--dx',L.dx+'px'); R.setProperty('--p',L.p+'px');
    R.setProperty('--heroY',(heroTop-HERO_TOP)+'px'); R.setProperty('--c',L.c);
    R.setProperty('--trTop',(yB+83.5*L.fF)+'px'); R.setProperty('--lgTop',(yB+157.5*L.fF)+'px');
    logos.forEach(function(el){ var cx=parseFloat(el.style.left)+el.offsetWidth/2; el.style.setProperty('--lx',((cx-724.5)*(L.fx-1))+'px'); });
    drawFrame(L,heroTop,heroBot,yB);
  }

  /* ---------- SVG frame (grid, rails, nodes, pink circuitry) ---------- */
  function drawFrame(Lo,heroTop,heroBot,yB){
    var W=Lo.W,H=Lo.H,dx=Lo.dx,c=Lo.c,fF=Lo.fF,fx=Lo.fx,o=[];
    var r2=function(v){return +v.toFixed(2)};
    var X=function(x){return r2(dx+724.5+(x-724.5)*fx)};          // stretched grid x
    var Yh=function(y){return r2(heroTop+(y-HERO_TOP)*c)};          // hero-relative y
    var Yf=function(y){return r2(yB+(y-835.5)*fF)};                 // footer-relative y
    var L=function(d){o.push('<path d="'+d+'" class="ln"/>')};
    var sq=function(x,y){o.push('<rect class="sq" x="'+r2(x-3)+'" y="'+r2(y-3)+'" width="6" height="6"/>')};
    var gid=0;
    // pl: pink trace, gradient strong at (x1,y1). cls → draw-on class; rev → draw from (x2,y2)
    function pl(x1,y1,x2,y2,a1,a2,w,cls,rev){
      var id='g'+(gid++);
      o.push('<linearGradient id="'+id+'" gradientUnits="userSpaceOnUse" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"><stop offset="0" stop-color="#ff0466" stop-opacity="'+a1+'"/><stop offset="1" stop-color="#ff0466" stop-opacity="'+a2+'"/></linearGradient>');
      var d=rev?'M'+x2+' '+y2+'L'+x1+' '+y1:'M'+x1+' '+y1+'L'+x2+' '+y2;
      o.push('<path d="'+d+'" stroke="url(#'+id+')" stroke-width="'+(w||1.25)+'" fill="none"'+(cls?' class="dr '+cls+'" pathLength="1"':'')+'/>');
    }
    function node(x,y,big,port){
      var r=big?16:15, f=big?20:22;
      if(port) o.push('<g class="port">');
      o.push('<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="url(#glow)"/>');
      o.push('<ellipse cx="'+x+'" cy="'+y+'" rx="'+f+'" ry="1.9" fill="url(#fl)" opacity=".8"/>');
      o.push('<ellipse cx="'+x+'" cy="'+y+'" rx="1.9" ry="'+f+'" fill="url(#fl)" opacity=".8"/>');
      o.push('<circle cx="'+x+'" cy="'+y+'" r="1.7" fill="#ffc6e2"/>');
      if(port) o.push('</g>');
    }
    var flares=[], pulses={ph:[],pb:[]};
    // packet route: polyline points, speed (design units/s), start offset (s, relative to play)
    function route(group,pts,speed,start){
      var len=0; for(var i=1;i<pts.length;i++) len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
      len=r2(len); var dur=r2(len/speed);
      // pathLength 100 → the keyframes stay constant; --dash is the 18-unit packet expressed in that scale
      pulses[group].push('<path class="pulse" pathLength="100" style="--dash:'+r2(1800/len)+';--dur:'+dur+'s;--pd:'+start+'s" d="M'+pts.map(function(q){return q[0]+' '+q[1]}).join('L')+'"/>');
    }
    function flare(x1,y1,x2,y2){
      var id='f'+(gid++);
      o.push('<linearGradient id="'+id+'" gradientUnits="userSpaceOnUse" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>');
      flares.push('<path d="M'+x1+' '+y1+'L'+x2+' '+y2+'" stroke="url(#'+id+')" stroke-width="1.4"/>');
    }
    o.push('<defs><radialGradient id="glow"><stop offset="0" stop-color="#ffd0e6"/><stop offset=".12" stop-color="#ff3d8f"/><stop offset=".32" stop-color="#ff0466" stop-opacity=".62"/><stop offset=".62" stop-color="#ff0466" stop-opacity=".2"/><stop offset="1" stop-color="#ff0466" stop-opacity="0"/></radialGradient>'+
      '<pattern id="hatch" patternUnits="userSpaceOnUse" width="6.1" height="6.1" patternTransform="rotate(45)"><path d="M0 0V6.1" stroke="rgba(255,255,255,.2)" stroke-width="1.1"/></pattern><radialGradient id="fl"><stop offset="0" stop-color="#ff2a80"/><stop offset=".45" stop-color="#ff0466" stop-opacity=".55"/><stop offset="1" stop-color="#ff0466" stop-opacity="0"/></radialGradient></defs>');
    o.push('<style>.ln{stroke:rgba(255,255,255,.075);stroke-width:1;fill:none}.sq{fill:#262626}</style>');

    var LR=X(113), RR=X(1336), yT=134.5;
    var f881=Yf(881.5), f952=Yf(952.5), f1063=Yf(1063.5);

    L('M0.5 0V'+H); L('M'+r2(W-0.5)+' 0V'+H);
    L('M0 17.5H'+X(235.5)+'L'+X(357.5)+' 86.5H'+X(1090.5)+'L'+X(1213)+' 17.5H'+W);
    L('M'+X(235.5)+' 17.5V'+yT); L('M'+X(1213)+' 17.5V'+yT);
    [357.5,480,602,724,846,968.5,1090.5].forEach(function(q){L('M'+X(q)+' 86.5V'+yT)});
    L('M0 '+yT+'H'+W); L('M0 '+yB+'H'+W);
    L('M'+LR+' '+yT+'V'+H); L('M'+RR+' '+yT+'V'+H);
    for(var k=1;LR-k*STEP_X>24;k++){ var cx=r2(LR-k*STEP_X), cx2=r2(RR+k*STEP_X);
      L('M'+cx+' 17.5V'+f952); L('M'+cx2+' 17.5V'+f952); sq(cx,yT); sq(cx2,yT); sq(cx,yB); sq(cx2,yB); }

    // hex ports: scaled by c about (rail, tip)
    var tipY=Yh(543.5);
    var HY=function(y){return r2(tipY+(y-543.5)*c)}, HXl=function(x){return r2(LR+(x-113)*c)}, HXr=function(x){return r2(RR-(x-113)*c)};
    var hexTop=HY(451.5), hexBot=HY(640.5);
    var low=r2(yB-118*fF);
    var rows=[250.5,367.5];
    for(var y=367.5+STEP_Y; y<hexTop-50; y+=STEP_Y) rows.push(r2(y));
    for(var y2=low-STEP_Y; y2>hexBot+50; y2-=STEP_Y) rows.push(r2(y2));
    if(low>hexBot+20) rows.push(low);
    rows.forEach(function(r){ L('M0 '+r+'H'+LR); L('M'+RR+' '+r+'H'+W); sq(LR,r); sq(RR,r); });
    COLS.forEach(function(q){ sq(X(q),yT); sq(X(q),yB); });

    [357.5,480,602,724,846,968.5,1090.5].forEach(function(q){L('M'+X(q)+' '+yB+'V'+f881)});
    L('M'+X(357.5)+' '+f881+'H'+X(1090.5));
    L('M'+X(357.5)+' '+f881+'L'+X(235.5)+' '+f952+'H0');
    L('M'+X(1090.5)+' '+f881+'L'+X(1213)+' '+f952+'H'+W);
    L('M'+X(235.5)+' '+yB+'V'+f952); L('M'+X(1213)+' '+yB+'V'+f952);
    L('M0 '+f1063+'H'+W);
    o.push('<rect x="'+r2(LR-112)+'" y="'+f952+'" width="112" height="'+r2(f1063-f952)+'" fill="url(#hatch)"/>');
    o.push('<rect x="'+RR+'" y="'+f952+'" width="112" height="'+r2(f1063-f952)+'" fill="url(#hatch)"/>');

    var hexPts=[[113,451.5],[270.5,451.5],[324,546],[270.5,640.5],[113,640.5]];
    L('M'+hexPts.map(function(q){return HXl(q[0])+' '+HY(q[1])}).join('L'));
    L('M'+hexPts.map(function(q){return HXr(q[0])+' '+HY(q[1])}).join('L'));
    [HXl,HXr].forEach(function(HX,i){
      var a=HX(113), b=HX(256), tp=HX(289.5), y1=HY(485), y3=HY(603);
      sq(a,y1); sq(a,y3);
      pl(b,y1,a,y1,1,.12,1.6,'d1',true); pl(b,y3,a,y3,1,.12,1.6,'d1',true);
      pl(tp,tipY,b,y1,1,1,1.5,'d2',true); pl(tp,tipY,b,y3,1,1,1.5,'d2',true);
      var dir=i?-1:1, shellEdge=r2(dx+724.5-dir*347.5*c);
      pl(tp,tipY,r2(tp+(shellEdge-tp)*.85+dir*10),tipY,1,0,2,'d3');
      node(tp,tipY,true,true);
      flare(tp+dir*5,tipY,tp+dir*27,tipY);
      // packets enter at the rail, run the chevron, cross the tip and fade into the card.
      // observed: first packet rides the lower trace (the draw-on head), the upper one follows ~0.8s later.
      var conn=[r2(tp+(shellEdge-tp)*.9),tipY];
      route('ph',[[a,y3],[b,y3],[tp,tipY],conn],90,-.29);
      route('ph',[[a,y1],[b,y1],[tp,tipY],conn],90,.53);
    });

    // bottom port under the card (squeezes/stretches with the gap)
    var G2=yB-heroBot, nx=r2(dx+724), ny=r2(heroBot+Math.min(52,G2*.37)), dy2=r2(heroBot+Math.min(85,G2*.6));
    var lx=X(602), rx=X(846);
    pl(nx,ny,nx,heroBot,1,.05,1.2,'b1');
    pl(nx,ny,lx,dy2,1,.85,1.45,'b1'); pl(nx,ny,rx,dy2,1,.85,1.45,'b1');
    pl(lx,dy2,lx,yB-8,.9,0,1.25,'b2'); pl(rx,dy2,rx,yB-8,.9,0,1.25,'b2');
    node(nx,ny,true,true);
    // packets climb a column, run the diagonal into the node, then up into the card (left first, right ~1s later)
    route('pb',[[lx,yB-8],[lx,dy2],[nx,ny],[nx,heroBot]],80,-.19);
    route('pb',[[rx,yB-8],[rx,dy2],[nx,ny],[nx,heroBot]],80,.88);
    var sl=(dy2-ny)/(rx-nx);
    flare(nx+22,ny+22*sl,nx+46,ny+46*sl);

    var tail=Math.max(113,LR);
    [[LR,yT,1],[RR,yT,-1]].forEach(function(n){ pl(n[0],n[1],n[0]-n[2]*tail,n[1],.9,.12,1.3); pl(n[0],n[1],n[0],n[1]+120,.75,0,1.3); pl(n[0],n[1],n[0]+n[2]*26,n[1],.5,0,1.3); node(n[0],n[1]); });
    [[LR,yB,1],[RR,yB,-1]].forEach(function(n){ pl(n[0],n[1],n[0]-n[2]*tail,n[1],.9,.12,1.3); pl(n[0],n[1],n[0],n[1]-Math.min(120,yB-hexBot-10),.85,0,1.3); pl(n[0],n[1],n[0]+n[2]*26,n[1],.5,0,1.3); node(n[0],n[1]); });

    o.push('<g class="flares">'+flares.join('')+'</g>');
    o.push('<g class="pulses ph">'+pulses.ph.join('')+'</g><g class="pulses pb">'+pulses.pb.join('')+'</g>');
    if(playStart!==null) svg.style.setProperty('--el',((performance.now()-playStart)/1000).toFixed(3)+'s');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.innerHTML=o.join('');
  }

  /* ---------- interactions ---------- */
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  tabs.forEach(function(t){ t.addEventListener('click',function(){ tabs.forEach(function(x){x.setAttribute('aria-selected',x===t?'true':'false')}); }); });
  var mb=document.getElementById('menuBtn');
  mb.addEventListener('click',function(){ var o=root.classList.toggle('menu-open'); mb.setAttribute('aria-expanded',o); });

  var raf=0; function onResize(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(layout); }
  window.addEventListener('resize',onResize,{passive:true});
  if(window.visualViewport) visualViewport.addEventListener('resize',onResize,{passive:true});
  /* ---------- opening sequence ----------
     typewriter headline (35 ms/char) → header, subtitle, card, ports, footer
     are CSS-timed from the same t0 → URL placeholder types itself (56 ms/char). */
  var TYPE_MS=35, PH_START=1470, PH_MS=42, SETTLE_AT=3200;
  function intro(){
    if(!root.classList.contains('intro') || root.classList.contains('play')) return;
    var h1=document.querySelector('.h1'), l1=h1.querySelector('.l1'), l2=h1.querySelector('.l2'), cur=h1.querySelector('.cur');
    var A=l1.textContent, B=l2.textContent.replace(/_$/,'');
    var inp=document.querySelector('.field input'), PH=inp.getAttribute('placeholder');
    var lastK=-1, lastP=-1, phDone=false;
    function setHead(k){
      var a=Math.min(k,A.length), b=Math.max(0,k-A.length);
      l1.textContent=A.slice(0,a); l2.textContent=B.slice(0,b);
      (k<=A.length?l1:l2).appendChild(cur);
    }
    function finishPH(){ if(!phDone){ phDone=true; inp.setAttribute('placeholder',PH); } }
    inp.addEventListener('focus',finishPH); inp.addEventListener('input',finishPH);
    setHead(0); inp.setAttribute('placeholder','');
    playStart=performance.now();
    svg.style.setProperty('--el','0s');
    root.classList.add('typing','play');
    (function tick(){
      var t=performance.now()-playStart;
      var k=Math.min(A.length+B.length,Math.floor(t/TYPE_MS)+1);
      if(k!==lastK){ setHead(k); lastK=k; if(k===A.length+B.length) root.classList.remove('typing'); }
      if(!phDone){ var p=Math.max(0,Math.min(PH.length,Math.floor((t-PH_START)/PH_MS)+1)); if(p!==lastP){ inp.setAttribute('placeholder',PH.slice(0,p)); lastP=p; if(p===PH.length) phDone=true; } }
      if(t<SETTLE_AT) requestAnimationFrame(tick);
      else { setHead(A.length+B.length); finishPH(); root.classList.remove('typing','intro'); root.classList.add('settled'); }
    })();
  }

  layout();
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(layout);
    Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,300)})]).then(intro);
  } else intro();
})();
</script>
</body>
</html>
